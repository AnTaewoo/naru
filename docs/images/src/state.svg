<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" font-family="'Noto Sans CJK KR',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b3f45"/></marker>
  <style>
    .t{font-size:26px;font-weight:800;fill:#fff}
    .s{font-size:15px;fill:#fff;opacity:.95}
    .lab{font-size:15.5px;fill:#1f2328}
    .labm{font-size:14px;fill:#5f6670}
    .chip{fill:#fff;stroke:#c9ced6}
    .ct{font-size:14px;fill:#30353b}
    .rt{font-size:13px;fill:#5f6670;font-weight:600}
    .rv{font-size:16px;fill:#1f2328;font-weight:700}
    .ln{fill:none;stroke:#3b3f45;stroke-width:2}
  </style>
</defs>
<rect width="1600" height="600" fill="#fff"/>
<text x="48" y="58" font-size="28" font-weight="800" fill="#1b1b1b">횡단보도 상태</text>
<text x="48" y="88" font-size="16" fill="#5f6670">통제 구간 안의 횡단보도마다 상태를 매깁니다. 상태가 바뀔 때마다 이유를 기록하고, 화면의 '통제 근거'에서 보여 줍니다.</text>

<rect x="60" y="160" width="300" height="130" rx="16" fill="#ef8a00"/>
<text class="t" x="90" y="210">예정</text>
<text class="s" x="90" y="242">공지나 시간표에 통제가 나옴</text>
<text class="s" x="90" y="266">공지 글만 있으면 여기 머묾</text>

<rect x="650" y="160" width="300" height="130" rx="16" fill="#c62828"/>
<text class="t" x="680" y="210">통제 중</text>
<text class="s" x="680" y="242">실제로 막혔다는 근거가 있음</text>

<rect x="1240" y="160" width="300" height="130" rx="16" fill="#6b7280"/>
<text class="t" x="1270" y="210">해제</text>
<text class="s" x="1270" y="242">끝나는 시각에서 30분 지남</text>

<path class="ln" d="M360,225 H650" marker-end="url(#ar)"/>
<text class="lab" x="380" y="140" font-weight="700">확신도 0.8 이상</text>
<text class="lab" x="380" y="164">+ 실제 근거 + 시작 시각 지남</text>
<rect class="chip" x="380" y="245" width="118" height="30" rx="15"/><text class="ct" x="395" y="265">마라톤 시간표</text>
<rect class="chip" x="506" y="245" width="130" height="30" rx="15"/><text class="ct" x="519" y="265">TOPIS 실시간 돌발</text>
<rect class="chip" x="380" y="283" width="118" height="30" rx="15" stroke-dasharray="4 3"/><text class="ct" x="397" y="303">버스 이탈 (다음)</text>

<path class="ln" d="M950,225 H1240" marker-end="url(#ar)"/>
<text class="lab" x="975" y="210">끝나는 시각 + 30분</text>

<path class="ln" d="M210,290 V350 Q210,370 230,370 H1370 Q1390,370 1390,350 V290" marker-end="url(#ar)" stroke-dasharray="6 5"/>
<text class="labm" x="640" y="396">근거 없이 끝나도 끝나는 시각 + 30분이면 해제</text>

<rect x="60" y="440" width="1480" height="1" fill="#e3e6ea"/>
<text x="60" y="478" font-size="17" font-weight="800" fill="#1b1b1b">길찾기에서는</text>
<text class="rt" x="60" y="512">예정</text><text class="rv" x="60" y="540">통제 시간 안에 도착하면 +5분</text>
<text class="labm" x="60" y="564">돌아가는 길이 5분 넘게 더 걸리면 원래 길</text>
<text class="rt" x="440" y="512">통제 중</text><text class="rv" x="440" y="540">지나가지 않음</text>
<text class="labm" x="440" y="564">도착 시각 기준 · 지나간 뒤 시작하면 상관없음</text>
<text class="rt" x="820" y="512">해제</text><text class="rv" x="820" y="540">보통 길</text>
<text class="rt" x="1040" y="512" fill="#4a2a8a">예정 구역 · 확신도 0.7 미만</text><text class="rv" x="1040" y="540">지도에만 표시, 길찾기에 안 씀</text>
<text class="labm" x="1040" y="564">지역 이름만 있는 공지("여의도"), 모름 판정 집회</text>
</svg>
