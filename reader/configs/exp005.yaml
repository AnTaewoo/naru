# exp005 — 로컬 생성형 LLM + LoRA 사후학습 (R4.6, 선택)
# 조건: R0.2 VRAM 기록 + ADR-R02 승인. exp003이 val에서 이미 ADR-R01 기준 동급이면 태우가 생략 여부를 정한다.
exp_id: exp005
title: 로컬 생성형 LLM QLoRA — 정규형까지 직접 출력
system: gen_lora
data_version: v1

hypothesis: null
primary_metric: norm_f1
expected:
  val_norm_f1: null
decision_rule: null
max_attempts: 3

base_model:                        # ADR-R02 승인 후
  name: null
  revision: null
  license: null
  license_checked_at: null

input:
  context: prev_next
  published_at: true
output_schema: spans[{text, tag, canonical}]

method:
  quant: 4bit-nf4
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear

train:
  epochs: 3
  lr: 2.0e-4
  batch_size: 4
  grad_accum: 4
  max_length: 512
  seeds: [13]                      # VRAM·시간상 1개. PLAN에 명시

decoding:
  temperature: 0
  constrained: json_schema         # 방식(라이브러리)은 R4.6 PLAN 질문 — R0.2 환경을 보고

variants: [spans_ours, model_canonical]
latency:
  batch_size: 1
  warmup_sentences: 10

normalize: ours                    # spans_ours 변형에서만
eval:
  splits: [val]
