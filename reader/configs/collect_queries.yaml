# R1.1 — 네이버 뉴스 검색 쿼리 (초안). 쿼리가 곧 데이터 분포다.
# 태우 승인 후 확정. 바꿀 땐 커밋하고, 바꾼 이유를 R1.1 walkthrough에 적는다.
# 호출 수 = 쿼리 수 × len(sorts) × len(starts). 지금 초안: 16 × 2 × 11 = 352회
#
# start는 최대 1000, display는 최대 100 → 쿼리·정렬당 최대 약 1,100건
# sort=date는 최근 기사, sim은 관련도 순(기간이 넓게 퍼진다) — 둘 다 받아 기간 편향을 줄인다

display: 100
sorts: [date, sim]
starts: [1, 101, 201, 301, 401, 501, 601, 701, 801, 901, 1000]

queries:
  marathon:            # Naru 1순위 (ADR-001)
    - 서울마라톤 교통통제
    - 동아마라톤 교통통제
    - JTBC 서울마라톤 교통통제
    - 서울 하프마라톤 교통통제
    - 마라톤 대회 도로 통제 서울
  march:               # 집회·행진
    - 집회 행진 교통통제
    - 행진 차로 통제 세종대로
    - 광화문 집회 교통 통제
    - 숭례문 행진 통제
    - 여의대로 집회 통제
    - 도심 집회 우회 교통
  event:               # 기타 도로 통제 행사
    - 퀴어문화축제 교통통제
    - 연등행렬 교통통제
    - 서울세계불꽃축제 교통통제
  police:              # 경찰 교통관리 발표를 인용한 기사
    - 서울경찰청 교통 혼잡 집회
    - 경찰 교통관리 행진 구간

# R1.1 PLAN에서 볼 것:
# - 쿼리별 기사 수와 연도 분포 → 특정 기간·행사에 쏠리면 쿼리 조정
# - test 기간(2026~) 기사가 배분(100문장 × 3)을 감당하는지
# - 오래된 기간(2019~2023)이 부족하면 연도를 넣은 쿼리 추가 ("2023 서울마라톤 교통통제" 식)
