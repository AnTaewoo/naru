# exp004 — Claude few-shot, API 기준선 (R4.5)
# 모델 ID·가격은 실행일에 공식 문서를 열어 확인하고 여기에 출처와 함께 적는다. 기억으로 쓰지 않는다.
exp_id: exp004
title: Claude few-shot 구조화 출력
system: llm_fewshot
data_version: v1

hypothesis: null
primary_metric: norm_f1
expected:
  val_norm_f1: {claude-haiku-5-5: null, claude-sonnet-5-5: null}
decision_rule: null
max_attempts: 3                    # 프롬프트 버전 수 상한

models: [claude-haiku-5-5, claude-sonnet-5-5]
prompt_version: p1

few_shot:
  k: 8
  selection: tag_coverage          # train에서 태그가 고루 들어가게 고정 선택. val을 보고 고르지 않는다
  example_ids: []                  # R4.5 PLAN에서 채운다 (train sentence_id)

input:
  context: prev_next               # 주석자와 같은 정보
  published_at: true
output:
  mode: tool_use                   # input_schema: spans[{text, tag, canonical}]
decoding:
  temperature: 0
  max_tokens: 1024

variants: [spans_ours, llm_canonical]   # LLM 스팬 + 우리 정규화기 / LLM 정규형 그대로

pricing:                           # 실행일 공식 가격표에서 복사
  source_url: null
  checked_at: null
  usd_per_mtok:
    claude-haiku-5-5: {input: null, output: null}
    claude-sonnet-5-5: {input: null, output: null}
budget_usd: null                   # PLAN에서 정하는 상한. 넘으면 멈춘다

recorded: data/recorded/llm/anthropic   # <model>@api/<prompt_version>/<sentence_id>.json
eval:
  splits: [val]
